# JVM：AGP 9 + Kotlin 2.4 的编译进程需要更多堆；2048m 在 R8 全量压缩时会 OOM。
# Metaspace 提到 1536m：加上 :baselineprofile 模块后 1024m 会在构建末尾耗尽，
# 导致 Gradle daemon 每次都被迫重启。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

# Compose Preview Screenshot Testing:开启 screenshotTest 源集(host 侧渲染,不需要设备)
android.experimental.enableScreenshotTest=true
# 截图测试跑在宿主 JVM 上,渲染很吃内存
android.compose.screenshot.maxHeapSize=4g
