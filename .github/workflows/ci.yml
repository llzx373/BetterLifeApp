name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试 + 静态检查 + release 包。release 在没有 keystore.properties 时
  # 回退 debug 签名（见 README「发布构建与签名」），所以这里能在任何机器上跑通。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 不需要 android-actions/setup-android（v3 已随上游 issue #537 失效）：
      # ubuntu-latest 镜像自带的 Android SDK 已包含 compileSdk 37 所需平台，
      # 实测无需再装任何包即可通过全部构建。
      - name: 单元测试
        run: ./gradlew testDebugUnitTest

      - name: 静态检查（abortOnError，有 error 即失败）
        run: ./gradlew lint

      # 配置了 BETTERLIFE_KEYSTORE_BASE64 secret 时还原正式密钥库；
      # 没配置（如 fork/本地 act）则跳过，release 自动回退 debug 签名。
      - name: 还原正式签名密钥库
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BETTERLIFE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystoreFile=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建 release
        env:
          BETTERLIFE_KEYSTORE_FILE: ${{ steps.signing.outputs.keystoreFile }}
          BETTERLIFE_KEYSTORE_PASSWORD: ${{ secrets.BETTERLIFE_KEYSTORE_PASSWORD }}
          BETTERLIFE_KEY_ALIAS: ${{ secrets.BETTERLIFE_KEY_ALIAS }}
          BETTERLIFE_KEY_PASSWORD: ${{ secrets.BETTERLIFE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

  # 截图回归单独一个作业：它是最容易因环境差异变红的一环，
  # 独立出来后失败原因一眼可辨，不会和单测/构建的失败混在一起。
  #
  # 注意：这里**不跑** baseline profile 生成（./gradlew :app:generateBaselineProfile）——
  # 它需要连真机或模拟器，属于发布前的本机步骤，不是漏配。
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 配 Gradle（含依赖缓存）
        uses: gradle/actions/setup-gradle@v4

      # 不需要 android-actions/setup-android（v3 已随上游 issue #537 失效）：
      # ubuntu-latest 镜像自带的 Android SDK 已包含 compileSdk 37 所需平台。
      - name: 截图回归
        run: ./gradlew validateDebugScreenshotTest

      # 失败时把报告传上来：里面是 reference / actual / diff 三图对照，
      # 没有它就只能靠猜是哪一屏、差在哪。
      - name: 上传截图报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            app/build/reports/screenshotTest/**
            app/build/outputs/**
          if-no-files-found: ignore
